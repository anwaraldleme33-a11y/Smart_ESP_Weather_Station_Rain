<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز بحوث وتكنولوجيا المعلومات والاتصالات - محطة الطقس</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #1e293b;
            --accent: #10b981;
            --accent-dark: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 60px rgba(59, 130, 246, 0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(145deg, #0a0a1a 0%, #0f1a2e 40%, #0a0e1a 100%);
            color: var(--light);
            padding: 10px;
        }

        /* ========================================= */
        /* الصفحة الرئيسية */
        /* ========================================= */

        #mainPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            background: radial-gradient(ellipse at 30% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
                        linear-gradient(145deg, #080816 0%, #0f1a2e 50%, #080816 100%);
            position: relative;
            overflow: hidden;
        }

        #mainPage::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        #mainPage::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 30% 50%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(99, 102, 241, 0.03) 0%, transparent 50%);
            animation: bgFloat 25s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(1%, -1%) rotate(3deg) scale(1.02); }
            66% { transform: translate(-1%, 1%) rotate(-3deg) scale(0.98); }
        }

        .main-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
            padding: 20px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin-bottom: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(99, 102, 241, 0.15));
            padding: 8px;
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.12), inset 0 0 40px rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container:hover {
            transform: scale(1.04);
            box-shadow: 0 0 100px rgba(59, 130, 246, 0.2), inset 0 0 60px rgba(59, 130, 246, 0.08);
            border-color: rgba(59, 130, 246, 0.2);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: white;
            padding: 6px;
        }

        .organization-name {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }

        .organization-sub {
            font-size: 1.3rem;
            color: var(--gray-light);
            font-weight: 600;
            margin-top: 2px;
        }

        .divider-line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), transparent);
            margin: 12px auto;
            border-radius: 2px;
        }

        .organization-desc {
            font-size: 1.15rem;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }

        .organization-department {
            font-size: 0.95rem;
            color: var(--gray-light);
            margin-bottom: 28px;
            font-weight: 500;
            opacity: 0.8;
        }

        .enter-btn {
            padding: 18px 50px;
            font-size: 1.15rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .enter-btn:hover::before {
            opacity: 1;
        }

        .enter-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 48px rgba(59, 130, 246, 0.5);
        }

        .enter-btn i {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .enter-btn:hover i {
            transform: translateX(4px) rotate(-4deg);
        }

        .footer-info {
            position: absolute;
            bottom: 28px;
            left: 0;
            right: 0;
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--gray-light);
            padding: 0 20px;
            opacity: 0.7;
            z-index: 1;
        }

        .footer-info span {
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s ease;
        }

        .footer-info span:hover {
            opacity: 1;
        }

        .footer-info i {
            color: #60a5fa;
            font-size: 0.9rem;
        }

        /* ========================================= */
        /* صفحة محطة الطقس */
        /* ========================================= */

        #weatherPage {
            display: none;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        .back-home-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--gray-light);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: all var(--transition);
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .back-home-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.2);
            color: white;
            transform: translateX(-4px);
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== Header ===== */
        .header {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 24px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            font-size: 1.3rem;
            color: #60a5fa;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .device-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px 6px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: border-color var(--transition);
        }

        .device-selector:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .device-selector i {
            color: #60a5fa;
            font-size: 0.9rem;
        }

        .device-selector select {
            background: transparent;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            min-width: 110px;
            cursor: pointer;
            outline: none;
        }

        .device-selector select option {
            background: #1a1a3e;
            color: white;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.08);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(16, 185, 129, 0.15);
            transition: all var(--transition);
        }

        .status-indicator.offline {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.15);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .status-dot.offline {
            background: #ef4444;
            animation: none;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        #statusText {
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* ===== Controls ===== */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            min-width: 100px;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
            letter-spacing: 0.2px;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }

        .control-btn:active {
            transform: translateY(0px);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .control-btn.secondary {
            background: linear-gradient(135deg, #475569, #334155);
            box-shadow: 0 4px 16px rgba(71, 85, 105, 0.2);
        }

        .control-btn.secondary:hover {
            box-shadow: 0 8px 24px rgba(71, 85, 105, 0.35);
        }

        .control-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
        }

        .control-btn.success:hover {
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        }

        .control-btn.forecast {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.2);
        }

        .control-btn.forecast:hover {
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

        .calendar-container {
            position: relative;
        }

        .flatpickr-input {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            width: 140px;
            cursor: pointer;
            transition: border-color var(--transition);
            height: 100%;
            min-height: 42px;
            font-weight: 500;
        }

        .flatpickr-input:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .flatpickr-input:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* ===== Dashboard ===== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .readings-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .readings-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            opacity: 0.6;
        }

        .card-title {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .card-title i {
            font-size: 1rem;
            opacity: 0.8;
        }

        .readings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
        }

        .reading-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all var(--transition);
            border: 1px solid transparent;
        }

        .reading-item:hover {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.4);
        }

        .reading-item.updating {
            animation: update-pulse 0.8s ease;
        }

        @keyframes update-pulse {
            0% { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.3); }
            100% { background: rgba(0, 0, 0, 0.3); border-color: transparent; }
        }

        .reading-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(99, 102, 241, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #60a5fa;
            flex-shrink: 0;
        }

        .reading-info {
            flex: 1;
            min-width: 0;
        }

        .reading-info h3 {
            font-size: 0.65rem;
            color: var(--gray-light);
            margin-bottom: 1px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .reading-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            letter-spacing: 0.3px;
        }

        .reading-value .unit {
            font-size: 0.7rem;
            color: var(--gray-light);
            font-weight: 500;
            margin-right: 2px;
        }

        /* ===== Compass ===== */
        .compass-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
        }

        .compass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            opacity: 0.4;
        }

        .compass-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 6px 0;
        }

        .compass-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ef4444 0deg, #f97316 45deg, #eab308 90deg,
                #22c55e 135deg, #0ea5e9 180deg, #3b82f6 225deg,
                #8b5cf6 270deg, #ec4899 315deg, #ef4444 360deg
            );
            position: relative;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.05);
        }

        .compass-inner {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            bottom: 14px;
            background: radial-gradient(circle at center, #0f172a, #070b14);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .compass-directions {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .compass-direction {
            position: absolute;
            font-weight: 700;
            color: white;
            font-size: 0.9rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            opacity: 0.8;
        }

        .direction-n { top: 8px; left: 50%; transform: translateX(-50%); }
        .direction-e { top: 50%; right: 8px; transform: translateY(-50%); }
        .direction-s { bottom: 8px; left: 50%; transform: translateX(-50%); }
        .direction-w { top: 50%; left: 8px; transform: translateY(-50%); }

        .compass-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            width: 6px;
            height: 6px;
        }

        .needle {
            width: 2.5px;
            height: 78px;
            background: linear-gradient(to bottom, #f8fafc, #ef4444);
            border-radius: 2px;
            position: absolute;
            top: -78px;
            left: 1.75px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3), 0 0 60px rgba(239, 68, 68, 0.1);
        }

        .needle::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -5px;
            width: 13px;
            height: 13px;
            background: #ef4444;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.3));
        }

        .compass-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at center, #f8fafc, #cbd5e1);
            border-radius: 50%;
            z-index: 11;
            border: 2px solid #0f172a;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.6);
        }

        .direction-info {
            margin-top: 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            min-width: 140px;
            border: 1px solid var(--border-color);
        }

        .direction-text {
            font-size: 1rem;
            color: #60a5fa;
            font-weight: 600;
        }

        .direction-degree {
            font-size: 0.8rem;
            color: var(--gray-light);
        }

        /* ===== System Info ===== */
        .system-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 6px;
            border: 1px solid var(--border-color);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--gray-light);
        }

        .info-item i {
            color: #60a5fa;
            font-size: 0.85rem;
        }

        /* ===== Modals ===== */
        .archive-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
        }

        .archive-content {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.97), rgba(10, 15, 30, 0.97));
            border-radius: 20px;
            padding: 28px 30px;
            width: 90%;
            max-width: 1100px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);

        .archive-content::-webkit-scrollbar {
            width: 6px;
        }

        /* ===== Tables ===== */
        .archive-table {
            width: 100%;

            margin-top: 16px;

        .archive-table th {

        .no-data {

        /* ===== Loading ===== */

        .loading-spinner {

        @keyframes spin {

            100% { transform: rotate(360deg); }

        /* ===== Forecast Tabs ===== */

            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;

        .forecast-tab {
            background: rgba(71, 85, 105, 0.3);

        .forecast-tab:hover {

        .forecast-tab.active {

        .forecast-title {

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;

            .enter-btn {

        @media (max-width: 480px) {

        /* ===== Flatpickr Overrides ===== */
        .flatpickr-calendar {

    </style>
</head>

<body>

    <!-- ========================================= -->
    <!-- JavaScript -->
    <!-- ========================================= -->

    <script>

        // =========================================
        // الانتقال للصفحة
        // =========================================

        function goToWeatherPage() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('weatherPage').style.display = 'block';
            if (!window.weatherInitialized) {
                initWeather();
                window.weatherInitialized = true;
            }
        }

        function goToHomePage() {
            document.getElementById('weatherPage').style.display = 'none';
            document.getElementById('mainPage').style.display = 'flex';
        }


        // =========================================
        // المتغيرات
        // =========================================

        let currentDevice = 'max1';
        let autoRefreshEnabled = true;
        let refreshInterval = null;
        let currentCompassRotation = 0;
        let flatpickrInstance = null;

        let currentForecast24 = [];
        let currentForecast7 = [];
        let currentForecastAIInfo = null;

        const contentArea = document.getElementById('contentArea');
        const deviceSelect = document.getElementById('deviceSelect');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const autoRefreshText = document.getElementById('autoRefreshText');
        const archiveModal = document.getElementById('archiveModal');
        const archiveContent = document.getElementById('archiveContent');
        const forecastModal = document.getElementById('forecastModal');
        const forecastContent = document.getElementById('forecastContent');
        const loadingOverlay = document.getElementById('loadingOverlay');


        // =========================================
        // تهيئة الطقس
        // =========================================

        function initWeather() {
            initializeCalendar();
            createCurrentDataInterface();
            loadCurrentData();
            startAutoRefresh();
            setupEventListeners();
        }


        // =========================================
        // التقويم
        // =========================================

        function initializeCalendar() {
            flatpickrInstance = flatpickr("#archiveDate", {
                locale: "ar",
                dateFormat: "Y-m-d",
                maxDate: "today",
                defaultDate: new Date(),
                onChange: function(selectedDates, dateStr) {
                    if (dateStr) {
                        console.log("التاريخ المحدد:", dateStr);
                    }
                }
            });
        }


        // =========================================
        // الأحداث
        // =========================================

        function setupEventListeners() {
            deviceSelect.addEventListener('change', function() {
                currentDevice = this.value;
                loadCurrentData();
            });
        }


        // =========================================
        // توقيت بغداد
        // =========================================

        function formatBaghdadTime(dateString) {
            if (!dateString) return 'الآن';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return 'الآن';
                const baghdadDate = new Date(date.getTime() + (3 * 60 * 60 * 1000));
                let hours = baghdadDate.getUTCHours();
                const minutes = baghdadDate.getUTCMinutes();
                const ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
                hours = hours % 12;
                hours = hours ? hours : 12;
                return hours + ':' + (minutes < 10 ? '0' : '') + minutes + ' ' + ampm;
            } catch (e) {
                return 'الآن';
            }
        }


        // =========================================
        // اتجاه الرياح
        // =========================================

        function getWindDirectionDegree(direction) {
            if (!direction) return 0;
            const dirLower = String(direction).toLowerCase().trim();
            if (dirLower === 'شمالي' || dirLower === 'شمال' || dirLower === 'north' || dirLower === 'n') return 0;
            if (dirLower === 'شمالي شرقي' || dirLower === 'northeast' || dirLower === 'ne') return 45;
            if (dirLower === 'شرقي' || dirLower === 'شرق' || dirLower === 'east' || dirLower === 'e') return 90;
            if (dirLower === 'جنوبي شرقي' || dirLower === 'southeast' || dirLower === 'se') return 135;
            if (dirLower === 'جنوبي' || dirLower === 'جنوب' || dirLower === 'south' || dirLower === 's') return 180;
            if (dirLower === 'جنوبي غربي' || dirLower === 'southwest' || dirLower === 'sw') return 225;
            if (dirLower === 'غربي' || dirLower === 'غرب' || dirLower === 'west' || dirLower === 'w') return 270;
            if (dirLower === 'شمالي غربي' || dirLower === 'northwest' || dirLower === 'nw') return 315;
            const numMatch = String(direction).match(/\d+/);
            if (numMatch) {
                return parseInt(numMatch[0]) % 360;
            }
            return 0;
        }


        // =========================================
        // تحميل البيانات الحالية
        // =========================================

        async function loadCurrentData() {
            try {
                showLoadingEffect();
                const response = await fetch('/api/sensor?device=' + encodeURIComponent(currentDevice));
                if (!response.ok) {
                    throw new Error('خطأ في الخادم: ' + response.status);
                }
                const data = await response.json();
                let todayData = [];
                if (data.today && Array.isArray(data.today)) {
                    todayData = data.today;
                } else if (Array.isArray(data)) {
                    todayData = data;
                }
                if (todayData.length === 0) {
                    showNoData();
                    return;
                }
                const latestReading = todayData[todayData.length - 1];
                updateStatus('متصل', true);
                if (!document.getElementById('temperatureValue')) {
                    createCurrentDataInterface();
                }
                updateCurrentData(latestReading);
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                updateStatus('غير متصل', false);
                showError(error.message);
            } finally {
                hideLoadingEffect();
            }
        }


        // =========================================
        // تحديث القراءات
        // =========================================

        function updateCurrentData(data) {
            const temperature = parseFloat(data.temperture || data.temperature || 0);
            const humidity = parseFloat(data.humidity || 0);
            const pressure = parseFloat(data.pressure || 0);
            const windSpeed = parseFloat(data.winds || data.windS || 0);
            const windDirection = data.windd || data.windD || 'غير معروف';
            const rainy = data.rainy || false;

            let readingTime = 'الآن';
            if (data.time) {
                readingTime = formatBaghdadTime(data.time);
            } else if (data.reading_date) {
                readingTime = formatBaghdadTime(data.reading_date);
            }

            const validTemp = isNaN(temperature) ? 0 : temperature;
            const validHumidity = isNaN(humidity) ? 0 : humidity;
            const validPressure = isNaN(pressure) ? 0 : pressure;
            const validWindSpeed = isNaN(windSpeed) ? 0 : windSpeed;

            updateReadingValue('temperatureValue', validTemp.toFixed(1) + '<span class="unit">°C</span>');
            updateReadingValue('humidityValue', validHumidity.toFixed(1) + '<span class="unit">%</span>');
            updateReadingValue('pressureValue', validPressure.toFixed(1) + '<span class="unit">hPa</span>');
            updateReadingValue('windSpeedValue', validWindSpeed.toFixed(1) + '<span class="unit">m/s</span>');

            const rainValue = document.getElementById('rainValue');
            if (rainValue) {
                if (rainy === true || rainy === 1 || rainy === 'true' || rainy === '1') {
                    rainValue.textContent = '🌧️ ممطر';
                } else {
                    rainValue.textContent = '☀️ غير ممطر';
                }
            }

            const timeElement = document.getElementById('readingTime');
            if (timeElement) {
                timeElement.textContent = readingTime;
            }

            updateCompass(windDirection);
        }


        // =========================================
        // تحديث قيمة
        // =========================================

        function updateReadingValue(elementId, newValue) {
            const element = document.getElementById(elementId);
            if (element) {
                const parent = element.closest('.reading-item');
                if (parent) {
                    parent.classList.add('updating');
                    setTimeout(function() {
                        parent.classList.remove('updating');
                    }, 800);
                }
                element.innerHTML = newValue;
            }
        }


        // =========================================
        // البوصلة
        // =========================================

        function updateCompass(direction) {
            const degrees = getWindDirectionDegree(direction);
            const directionElement = document.getElementById('windDirectionText');
            const degreeElement = document.getElementById('windDirectionDegree');

            if (directionElement) {
                directionElement.textContent = direction || 'غير معروف';
            }
            if (degreeElement) {
                degreeElement.textContent = degrees + '°';
            }

            const needle = document.getElementById('compassNeedle');
            if (needle) {
                let rotation = degrees;
                let diff = rotation - currentCompassRotation;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                rotation = currentCompassRotation + diff;
                currentCompassRotation = rotation;
                needle.style.transform = 'translate(-50%, -50%) rotate(' + rotation + 'deg)';
            }
        }


        // =========================================
        // إنشاء واجهة البيانات
        // =========================================

        function createCurrentDataInterface() {
            const content = `
                <div class="dashboard-grid">

                    <div class="readings-card">
                        <h2 class="card-title">
                            <i class="fas fa-chart-line"></i>
                            القراءات
                        </h2>

                        <div class="readings-grid">

                            <div class="reading-item" id="tempItem">
                                <div class="reading-icon">
                                    <i class="fas fa-thermometer-half"></i>
                                </div>
                                <div class="reading-info">
                                    <h3>الحرارة</h3>
                                    <div class="reading-value" id="temperatureValue">0.0<span class="unit">°C</span></div>
                                </div>
                            </div>

                            <div class="reading-item" id="humidityItem">
                                <div class="reading-icon">
                                    <i class="fas fa-tint"></i>
                                </div>
                                <div class="reading-info">
                                    <h3>الرطوبة</h3>
                                    <div class="reading-value" id="humidityValue">0.0<span class="unit">%</span></div>
                                </div>
                            </div>

                            <div class="reading-item" id="pressureItem">
                                <div class="reading-icon">
                                    <i class="fas fa-tachometer-alt"></i>
                                </div>
                                <div class="reading-info">
                                    <h3>الضغط</h3>
                                    <div class="reading-value" id="pressureValue">0.0<span class="unit">hPa</span></div>
                                </div>
                            </div>

        async function loadForecastData() {
            try {
                showLoading(true);
                forecastModal.style.display = 'flex';
                forecastContent.innerHTML = `
                    <div style="text-align:center; padding:50px 20px;">
                        <i class="fas fa-spinner fa-spin fa-3x" style="color:#60a5fa;"></i>
                        <h3 style="margin-top:20px; color:#94a3b8; font-weight:600;">جاري إنشاء التنبؤ...</h3>

                    </div>
                `;
                const deviceQuery = encodeURIComponent(currentDevice);
                const responses = await Promise.allSettled([
                    fetch('/api/forecast?device=' + deviceQuery),
                    fetch('/api/ai-forecast?device=' + deviceQuery)
                ]);

                if (responses[0].status !== 'fulfilled' || !responses[0].value.ok) {
                    const status = responses[0].status === 'fulfilled' ? responses[0].value.status : 'network';
                    throw new Error('خطأ في الخادم: ' + status);
                }
                const result = await responses[0].value.json();
                if (!result.success) {
                    throw new Error(result.error || 'فشل إنشاء التنبؤ');
                }
                currentForecast24 = result.forecast24h || [];
                currentForecast7 = result.forecast7days || [];
                currentForecastAIInfo = null;

                if (responses[1].status === 'fulfilled' && responses[1].value.ok) {
                    try {
                        const aiResult = await responses[1].value.json();
                        if (aiResult.success && Array.isArray(aiResult.forecast7days)) {
                            currentForecastAIInfo = {
                                historyDays: aiResult.historyDays || 0,
                                bootstrapped: Boolean(aiResult.bootstrapped),
                                model: aiResult.model || 'Weather AI'
                            };
                            const aiForecastByDate = new Map(
                                aiResult.forecast7days.map(function(aiDay) {
                                    return [String(aiDay.date).slice(0, 10), aiDay];
                                })
                            );
                            currentForecast7 = currentForecast7.map(function(item) {
                                const itemDate = String(item.date).slice(0, 10);
                                const ai = aiForecastByDate.get(itemDate);
                                if (!ai || ai.available !== true) {
                                    return {
                                        ...item,
                                        aiAvailable: false,
                                        aiError: ai ? ai.error : 'No matching AI forecast'
                                    };
                                }
                                return {
                                    ...item,
                                    rainProbability: ai.rainProbability,
                                    rainfallMm: ai.rainfallMm,
                                    rawRainfallMm: ai.rawRainfallMm,
                                    rainExpected: ai.rain,
                                    aiThreshold: ai.threshold,
                                    aiAvailable: true,
                                    aiDay: ai.day
                                };
                            });
                        }
                    } catch (aiError) {
                        console.warn('تعذر دمج تنبؤ AI:', aiError);
                    }
                }
                displayForecast();
            } catch (error) {
                console.error('خطأ في التنبؤ:', error);
                forecastContent.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-triangle fa-3x" style="color:#ef4444; margin-bottom:20px;"></i>
                        <h2 style="color:#ef4444;">خطأ في التنبؤ</h2>
                        <p style="color:#94a3b8; margin-top:10px;">${error.message}</p>
                    </div>
                `;
            } finally {
                showLoading(false);
            }
        }

        // =========================================
        // رقم آمن
        // =========================================

        function safeNumber(value) {
            const number = Number(value);
            if (isNaN(number)) {
                return '0.0';
            }
            return number.toFixed(1);
        }


        // =========================================
        // تنسيق وقت التنبؤ
        // =========================================

        function formatForecastTime(dateString) {
            if (!dateString) return '--';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) {
                    return '--';
                }
                let hours = date.getHours();
                const minutes = date.getMinutes();
                const ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
                hours = hours % 12;
                hours = hours || 12;
                return hours + ':' + (minutes < 10 ? '0' : '') + minutes + ' ' + ampm;
            } catch (e) {
                return '--';
            }
        }


        // =========================================
        // تنسيق تاريخ التنبؤ
        // =========================================

        function formatForecastDate(dateString) {
            if (!dateString) return '--';
            try {
                const date = new Date(dateString + 'T00:00:00');
                if (isNaN(date.getTime())) {
                    return dateString;
                }
                return date.toLocaleDateString('ar-IQ', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (e) {
                return dateString;
            }
        }

            ['الحرارة', 'Temperature'],
            ['الرطوبة', 'Humidity'],
            ['الضغط', 'Pressure'],
            ['سرعة الرياح', 'Wind Speed'],
            ['اتجاه الرياح', 'Wind Direction'],
            ['المطر', 'Rain'],
            ['آخر تحديث:', 'Last Update:'],
            ['🌧️ ممطر', '🌧️ Rainy'],
            ['☀️ غير ممطر', '☀️ No Rain'],
            ['متصل', 'Connected'],
            ['غير متصل', 'Disconnected'],
            ['غير معروف', 'Unknown'],
            ['الآن', 'Now'],
            ['صباحاً', 'AM'],
            ['مساءً', 'PM'],
            ['الوقت', 'Time'],
            ['التاريخ', 'Date']
        ];

        const arToEn = new Map(languagePairs);
        const enToAr = new Map(languagePairs.map(function(pair) {
            return [pair[1], pair[0]];
        }));

        function translateTextValue(value) {
            if (typeof value !== 'string' || value.trim() === '') {
                return value;
            }
            let result = value;
            const map = currentLanguage === 'en' ? arToEn : enToAr;
            const entries = Array.from(map.entries()).sort(function(a, b) {
                return b[0].length - a[0].length;
            });
            entries.forEach(function(entry) {
                const from = entry[0];
                const to = entry[1];
                if (result.includes(from)) {
                    result = result.split(from).join(to);
                }
            });
            return result;
        }

        let languageUpdateRunning = false;

        function translateNode(root) {
            if (!root) return;
            if (root.nodeType === Node.TEXT_NODE) {
                const translated = translateTextValue(root.nodeValue);
                if (translated !== root.nodeValue) {
                    root.nodeValue = translated;
                }
                return;
            }
            if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) {
                return;
            }
            if (root.nodeType === Node.ELEMENT_NODE && (root.tagName === 'SCRIPT' || root.tagName === 'STYLE')) {
                return;
            }
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            let node;
            while (node = walker.nextNode()) {
                const parent = node.parentElement;
                if (parent && parent.tagName !== 'SCRIPT' && parent.tagName !== 'STYLE') {
                    nodes.push(node);
                }
            }
            nodes.forEach(function(textNode) {
                const translated = translateTextValue(textNode.nodeValue);
                if (translated !== textNode.nodeValue) {
                    textNode.nodeValue = translated;
                }
            });
        }

        function updateLanguageButton() {
            const languageBtn = document.getElementById('languageBtn');
            if (!languageBtn) return;
            const newHTML = currentLanguage === 'ar'
                ? '<i class="fas fa-language"></i> English'
                : '<i class="fas fa-language"></i> العربية';
            if (languageBtn.innerHTML.trim() !== newHTML.trim()) {
                languageBtn.innerHTML = newHTML;
            }
        }

        function updateLanguageDirection() {
            const isArabic = currentLanguage === 'ar';
            document.documentElement.lang = isArabic ? 'ar' : 'en';
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.body.dir = isArabic ? 'rtl' : 'ltr';
        }

        function updateLanguagePlaceholder() {
            const archiveDate = document.getElementById('archiveDate');
            if (archiveDate) {
                archiveDate.placeholder = currentLanguage === 'ar' ? 'اختر تاريخ' : 'Select Date';
            }
        }

        function updateFlatpickrLanguage() {
            if (!flatpickrInstance) return;
            try {
                if (currentLanguage === 'ar' && flatpickr.l10ns && flatpickr.l10ns.ar) {
                    flatpickrInstance.set('locale', flatpickr.l10ns.ar);
                } else {
                    flatpickrInstance.set('locale', 'default');
                }
            } catch (error) {
                console.log('Language calendar update:', error);
            }
        }

        function applyLanguage() {
            if (languageUpdateRunning) return;
            languageUpdateRunning = true;
            updateLanguageDirection();
            document.title = currentLanguage === 'ar'
                ? 'مركز بحوث وتكنولوجيا المعلومات والاتصالات - محطة الطقس'
                : 'Research Center for Information and Communications Technology - Weather Station';
            translateNode(document.body);
            updateLanguagePlaceholder();
            updateLanguageButton();
            updateFlatpickrLanguage();
            languageUpdateRunning = false;
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'ar' ? 'en' : 'ar';
            localStorage.setItem('weatherLanguage', currentLanguage);
            applyLanguage();
        }

        const languageObserver = new MutationObserver(function(mutations) {
            if (languageUpdateRunning) return;
            if (currentLanguage !== 'en') return;
            mutations.forEach(function(mutation) {
                mutation.addedNodes.forEach(function(node) {
                    translateNode(node);
                });
            });
            updateLanguageButton();
        });

        languageObserver.observe(document.body, {
            childList: true,
            subtree: true
        });

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                applyLanguage();
            }, 150);
        });

    </script>

</body>
</html>
