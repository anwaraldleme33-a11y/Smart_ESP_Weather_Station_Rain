<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Monitoring Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22c55e;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .card h3 {
      margin: 0;
      font-size: 16px;
      color: var(--muted);
    }

    .value {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
      color: var(--accent);
    }

    .unit {
      font-size: 16px;
      color: var(--muted);
    }

    /* بوصلة حقيقية */
    .compass-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
      max-width: 1200px;
      padding: 20px;
    }

    .compass {
      width: 200px;
      height: 200px;
      background: var(--card);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
      border: 4px solid var(--muted);
    }

    .compass-inner {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* النقاط الأساسية للبوصلة */
    .compass-point {
      position: absolute;
      font-size: 14px;
      font-weight: bold;
      color: var(--muted);
    }

    .compass-point.n { top: 5px; left: 50%; transform: translateX(-50%); color: #ff4444; }
    .compass-point.s { bottom: 5px; left: 50%; transform: translateX(-50%); }
    .compass-point.e { right: 5px; top: 50%; transform: translateY(-50%); }
    .compass-point.w { left: 5px; top: 50%; transform: translateY(-50%); }

    /* إبرة البوصلة */
    .needle {
      position: absolute;
      width: 4px;
      height: 70px;
      background: #ff4444;
      top: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translate(-50%, -100%) rotate(0deg);
      transition: transform 0.5s ease;
      border-radius: 2px;
      z-index: 2;
    }

    .needle::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 15px solid #ff4444;
    }

    .needle-center {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ff4444;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      border: 2px solid var(--bg);
    }

    /* مؤشر اتجاه الرياح النصي */
    .wind-direction-text {
      text-align: center;
      font-size: 18px;
      color: var(--accent);
      margin-top: 10px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 15px;
      font-size: 14px;
    }

    select {
      background: var(--card);
      color: var(--text);
      border: none;
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
    }

    /* تنسيق أيقونة المطر */
    .rain-icon {
      font-size: 40px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<header>
  🌦 Weather Monitoring System
  <br>
  <select id="deviceSelect">
    <option value="max1">Station max1</option>
    <option value="max2">Station max2</option>
    <option value="max3">Station max3</option>
    <option value="max4">Station max4</option>
  </select>
</header>

<div class="container">
  <div class="card">
    <h3>Temperature</h3>
    <div class="value" id="temp">--</div>
    <div class="unit">°C</div>
  </div>

  <div class="card">
    <h3>Humidity</h3>
    <div class="value" id="hum">--</div>
    <div class="unit">%</div>
  </div>

  <div class="card">
    <h3>Pressure</h3>
    <div class="value" id="pres">--</div>
    <div class="unit">hPa</div>
  </div>

  <div class="card">
    <h3>Wind Speed</h3>
    <div class="value" id="windS">--</div>
    <div class="unit">m/s</div>
  </div>

  <div class="card">
    <h3>Rain</h3>
    <div class="value" id="rain">--</div>
    <div class="unit">mm</div>
  </div>
</div>

<!-- بوصلة حقيقية لاتجاه الرياح -->
<div class="compass-container">
  <div class="compass">
    <div class="compass-inner">
      <div class="compass-point n">N</div>
      <div class="compass-point s">S</div>
      <div class="compass-point e">E</div>
      <div class="compass-point w">W</div>
      <div class="needle" id="needle"></div>
      <div class="needle-center"></div>
    </div>
  </div>
</div>

<div class="wind-direction-text" id="windDirectionText">Direction: --</div>

<footer>
  ESP32 + BME280 + Rain Sensor + Neon + Vercel
</footer>

<script>
  const API_URL = "/api/sensor";
  const tempEl = document.getElementById("temp");
  const humEl  = document.getElementById("hum");
  const presEl = document.getElementById("pres");
  const windSEl = document.getElementById("windS");
  const windDEl = document.getElementById("windDirectionText");
  const rainEl = document.getElementById("rain");
  const deviceSelect = document.getElementById("deviceSelect");
  const needle = document.getElementById("needle");

  async function fetchData() {
    const device = deviceSelect.value;
    const res = await fetch(`${API_URL}?device=${device}`);
    const data = await res.json();

    if (!data.length) return;

    const last = data[data.length - 1];

    tempEl.textContent  = last.temperature.toFixed(1);
    humEl.textContent   = last.humidity.toFixed(1);
    presEl.textContent  = last.pressure.toFixed(1);
    windSEl.textContent = last.windS.toFixed(1);
    rainEl.textContent  = last.rain ? last.rain.toFixed(1) : "0.0";

    // تحديث البوصلة
    const windDirection = last.windD || "N";
    const angle = getWindAngle(windDirection);
    needle.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
    windDEl.textContent = `Direction: ${windDirection}`;
  }

  function getWindAngle(direction) {
    const directions = {
      'N': 0,
      'NNE': 22.5,
      'NE': 45,
      'ENE': 67.5,
      'E': 90,
      'ESE': 112.5,
      'SE': 135,
      'SSE': 157.5,
      'S': 180,
      'SSW': 202.5,
      'SW': 225,
      'WSW': 247.5,
      'W': 270,
      'WNW': 292.5,
      'NW': 315,
      'NNW': 337.5
    };
    return directions[direction] || 0;
  }

  deviceSelect.addEventListener("change", fetchData);

  fetchData();
  setInterval(fetchData, 5000);
</script>

</body>
</html>
