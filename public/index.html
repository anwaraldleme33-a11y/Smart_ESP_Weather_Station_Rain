<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز بحوث وتكنولوجيا المعلومات والاتصالات - محطة الطقس</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- إضافة مكتبة Flatpickr للتقويم -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>
    
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #1e293b;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 100%);
            color: var(--light);
            padding: 20px;
        }
        
        /* ===== الصفحة الرئيسية ===== */
        #mainPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 50%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }

        #mainPage::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 70% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -2%) rotate(5deg); }
            66% { transform: translate(-2%, 2%) rotate(-5deg); }
        }

        .main-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 900px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(99, 102, 241, 0.2));
            padding: 15px;
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.25);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: white;
            padding: 5px;
        }

        .organization-name {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .organization-sub {
            font-size: 1.8rem;
            color: #94a3b8;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .divider-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            margin: 10px auto;
            border-radius: 2px;
        }

        .organization-desc {
            font-size: 1.4rem;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 5px;
        }

        .organization-department {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .enter-btn {
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .enter-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.5);
        }

        .enter-btn i {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .enter-btn:hover i {
            transform: translateX(5px) rotate(-5deg);
        }

        .footer-info {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 0.85rem;
            color: #64748b;
            padding: 0 20px;
        }

        .footer-info span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-info i {
            color: #38bdf8;
        }

        /* ===== صفحة الطقس ===== */
        #weatherPage {
            display: none;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }

        /* زر العودة */
        .back-home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .back-home-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateX(-5px);
        }

        /* ===== أنماط الطقس الحالية (نفس الكود الأصلي) ===== */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-info {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .device-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .device-selector select {
            background: transparent;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 150px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.2);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.online {
            background: #10b981;
        }
        
        .status-dot.offline {
            background: #ef4444;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            min-width: 180px;
            justify-content: center;
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        
        .control-btn.secondary {
            background: linear-gradient(135deg, #64748b, #475569);
        }
        
        .control-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        
        .calendar-container {
            position: relative;
        }
        
        .flatpickr-input {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            width: 200px;
            cursor: pointer;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .readings-card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .readings-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
        }
        
        .card-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .readings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .reading-item {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .reading-item.updating {
            animation: update-pulse 1s ease;
        }
        
        @keyframes update-pulse {
            0% { background: rgba(59, 130, 246, 0.3); }
            100% { background: rgba(15, 23, 42, 0.6); }
        }
        
        .reading-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(99, 102, 241, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #60a5fa;
        }
        
        .reading-info h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        
        .reading-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
        }
        
        .reading-unit {
            font-size: 1rem;
            color: #94a3b8;
            margin-right: 5px;
        }
        
        .compass-card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .compass-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
        }
        
        .compass-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ef4444 0deg, #f97316 45deg, #eab308 90deg,
                #22c55e 135deg, #0ea5e9 180deg, #3b82f6 225deg,
                #8b5cf6 270deg, #ec4899 315deg, #ef4444 360deg
            );
            position: relative;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }
        
        .compass-inner {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            background: var(--dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .compass-directions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        
        .compass-direction {
            position: absolute;
            font-weight: bold;
            color: white;
            font-size: 1.3rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .direction-n { top: 15px; left: 50%; transform: translateX(-50%); }
        .direction-e { top: 50%; right: 15px; transform: translateY(-50%); }
        .direction-s { bottom: 15px; left: 50%; transform: translateX(-50%); }
        .direction-w { top: 50%; left: 15px; transform: translateY(-50%); }
        
        .compass-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            width: 10px;
            height: 10px;
        }
        
        .needle {
            width: 4px;
            height: 120px;
            background: linear-gradient(to bottom, #f8fafc, #ef4444);
            border-radius: 2px;
            position: absolute;
            top: -120px;
            left: 3px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        
        .needle::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -8px;
            width: 20px;
            height: 20px;
            background: #ef4444;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        
        .compass-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25px;
            height: 25px;
            background: #f8fafc;
            border-radius: 50%;
            z-index: 11;
            border: 4px solid var(--dark);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .direction-info {
            margin-top: 20px;
            text-align: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 15px 30px;
            border-radius: 12px;
            min-width: 200px;
        }
        
        .direction-text {
            font-size: 1.4rem;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .direction-degree {
            font-size: 1.1rem;
            color: #94a3b8;
        }
        
        .system-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-item i {
            color: #38bdf8;
            font-size: 1.2rem;
        }
        
        .archive-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .archive-content {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-archive {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }
        
        .archive-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .archive-table th {
            background: rgba(59, 130, 246, 0.2);
            color: #38bdf8;
            padding: 12px;
            text-align: center;
        }
        
        .archive-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        
        .archive-table tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .no-data {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
        }
        
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .readings-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .header-info {
                justify-content: center;
            }
            
            .compass-wrapper {
                width: 220px;
                height: 220px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .control-btn {
                width: 100%;
                max-width: 300px;
            }

            .organization-name { font-size: 1.5rem; }
            .organization-sub { font-size: 1.4rem; }
            .organization-desc { font-size: 1.2rem; }
            .organization-department { font-size: 1rem; }
            .logo-container { width: 120px; height: 120px; }
            .enter-btn { padding: 14px 35px; font-size: 1.1rem; }
            .footer-info { gap: 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- الصفحة الرئيسية -->
    <!-- ============================================================ -->
    <div id="mainPage">
        <div class="main-content">
            <div class="logo-container">
                <img src="logo.png" alt="شعار المركز" id="logoImage">
            </div>
            <div class="organization-name">
                وزارة التعليم العالي والبحث العلمي
            </div>
            <div class="organization-sub">
                هيئة البحث العلمي
            </div>
            <div class="divider-line"></div>
            <div class="organization-desc">
                مركز بحوث وتكنولوجيا المعلومات والاتصالات
            </div>
            <div class="organization-department">
                قسم الانتاج والتصنيع الالكتروني
            </div>
            <button class="enter-btn" onclick="goToWeatherPage()">
                <i class="fas fa-cloud-sun"></i>
                دخول إلى محطة الطقس
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>

        <div class="footer-info">
            <span><i class="fas fa-map-marker-alt"></i> بغداد، العراق</span>
            <span><i class="fas fa-envelope"></i> secres@rdd.edu.iq</span>
            <span><i class="fas fa-phone"></i> +964 7731149340</span>
            <span><i class="fas fa-globe"></i> www.src.edu.iq</span>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- صفحة الطقس -->
    <!-- ============================================================ -->
    <div id="weatherPage">

        <button class="back-home-btn" onclick="goToHomePage()">
            <i class="fas fa-arrow-right"></i>
            العودة للرئيسية
        </button>

        <div class="container">
            <!-- الهيدر -->
            <div class="header">
                <h1>
                    <i class="fas fa-cloud-sun"></i>
                    لوحة تحكم محطة الطقس
                </h1>
                <div class="header-info">
                    <div class="device-selector">
                        <i class="fas fa-satellite"></i>
                        <select id="deviceSelect">
                            <option value="max1">محطة الطقس 1</option>
                            <option value="max2">محطة الطقس 2</option>
                            <option value="max3">محطة الطقس 3</option>
                            <option value="max4">محطة الطقس 4</option>
                        </select>
                    </div>
                    <div class="status-indicator">
                        <div class="status-dot online" id="statusDot"></div>
                        <span id="statusText">جاري التحميل...</span>
                    </div>
                </div>
            </div>

            <!-- التحكم -->
            <div class="controls">
                <button class="control-btn" onclick="loadCurrentData()">
                    <i class="fas fa-sync-alt"></i>
                    تحديث البيانات
                </button>
                <button class="control-btn secondary" onclick="toggleAutoRefresh()">
                    <i class="fas fa-clock"></i>
                    <span id="autoRefreshText">التحديث التلقائي: مفعل</span>
                </button>
                <div class="calendar-container">
                    <input type="text" id="archiveDate" class="flatpickr-input" placeholder="اختر تاريخ الأرشيف">
                </div>
                <button class="control-btn success" onclick="loadArchiveData()">
                    <i class="fas fa-history"></i>
                    عرض الأرشيف
                </button>
            </div>

            <!-- منطقة العرض الرئيسية -->
            <div id="contentArea">
                <!-- سيتم تعبئة المحتوى هنا -->
            </div>
        </div>
    </div>

    <!-- نافذة الأرشيف -->
    <div id="archiveModal" class="archive-modal">
        <div class="archive-content">
            <div class="archive-header">
                <h2 class="card-title">
                    <i class="fas fa-history"></i>
                    بيانات الأرشيف
                </h2>
                <button class="close-archive" onclick="closeArchive()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="archiveContent">
                <!-- سيتم تعبئة بيانات الأرشيف هنا -->
            </div>
        </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // ================================================================
        // التحكم بين الصفحات
        // ================================================================
        function goToWeatherPage() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('weatherPage').style.display = 'block';
            if (!window.weatherInitialized) {
                initWeather();
                window.weatherInitialized = true;
            }
        }

        function goToHomePage() {
            document.getElementById('weatherPage').style.display = 'none';
            document.getElementById('mainPage').style.display = 'flex';
        }

        // ================================================================
        // كود الطقس
        // ================================================================
        
        let currentDevice = 'max1';
        let autoRefreshEnabled = true;
        let refreshInterval = null;
        let currentCompassRotation = 0;

        const contentArea = document.getElementById('contentArea');
        const deviceSelect = document.getElementById('deviceSelect');
        const statusText = document.getElementById('statusText');
        const autoRefreshText = document.getElementById('autoRefreshText');
        const archiveModal = document.getElementById('archiveModal');
        const archiveContent = document.getElementById('archiveContent');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let flatpickrInstance = null;

        function initWeather() {
            initializeCalendar();
            loadCurrentData();
            startAutoRefresh();
            setupEventListeners();
        }

        function initializeCalendar() {
            flatpickrInstance = flatpickr("#archiveDate", {
                locale: "ar",
                dateFormat: "Y-m-d",
                maxDate: "today",
                defaultDate: new Date(),
                onChange: function(selectedDates, dateStr) {
                    if (dateStr) {
                        console.log("التاريخ المحدد:", dateStr);
                    }
                }
            });
        }

        function setupEventListeners() {
            deviceSelect.addEventListener('change', function() {
                currentDevice = this.value;
                loadCurrentData();
            });
        }

        async function loadCurrentData() {
            try {
                showLoadingEffect();
                
                const response = await fetch(`/api/sensor?device=${currentDevice}`);
                
                if (!response.ok) {
                    throw new Error(`خطأ في الخادم: ${response.status}`);
                }
                
                const data = await response.json();
                
                let todayData = [];
                if (data.today && Array.isArray(data.today)) {
                    todayData = data.today;
                } else if (Array.isArray(data)) {
                    todayData = data;
                }
                
                if (todayData.length === 0) {
                    showNoData();
                    return;
                }
                
                const latestReading = todayData[todayData.length - 1];
                
                updateStatus('متصل', true);
                
                if (!document.getElementById('temperatureValue')) {
                    createCurrentDataInterface();
                }
                
                updateCurrentData(latestReading);
                
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                updateStatus('غير متصل', false);
                showError(error.message);
            } finally {
                hideLoadingEffect();
            }
        }

        function updateCurrentData(data) {
            const temperature = data.temperture || 0;
            const humidity = data.humidity || 0;
            const pressure = data.pressure || 0;
            const windSpeed = data.winds || data.windS || 0;
            const windDirection = data.windd || data.windD || 'غير معروف';
            const rainy = data.rainy || false;
            const readingTime = data.time ? new Date(data.time).toLocaleString('ar-SA') : 'الآن';
            
            updateReadingValue('temperatureValue', temperature.toFixed(1) + '°C');
            updateReadingValue('humidityValue', humidity.toFixed(1) + '%');
            updateReadingValue('pressureValue', pressure.toFixed(1) + 'hPa');
            updateReadingValue('windSpeedValue', windSpeed.toFixed(1) + 'm/s');
            
            // تحديث حالة المطر في سطر واحد
            const rainValue = document.getElementById('rainValue');
            if (rainValue) {
                if (rainy === true || rainy === 1 || rainy === 'true') {
                    rainValue.textContent = '🌧️ ممطر';
                } else {
                    rainValue.textContent = '☀️ غير ممطر';
                }
            }
            
            const timeElement = document.getElementById('readingTime');
            if (timeElement) {
                timeElement.textContent = readingTime;
            }
            
            updateCompass(windDirection);
        }

        function updateReadingValue(elementId, newValue) {
            const element = document.getElementById(elementId);
            if (element) {
                const parent = element.closest('.reading-item');
                if (parent) {
                    parent.classList.add('updating');
                    setTimeout(() => {
                        parent.classList.remove('updating');
                    }, 1000);
                }
                element.textContent = newValue;
            }
        }

        function getWindDirectionDegree(direction) {
            const directions = {
                'شمالي': 0,
                'شمالي شرقي': 45,
                'شرقي': 90,
                'جنوبي شرقي': 135,
                'جنوبي': 180,
                'جنوبي غربي': 225,
                'غربي': 270,
                'شمالي غربي': 315,
                'شمال': 0,
                'شرق': 90,
                'جنوب': 180,
                'غرب': 270,
                'N': 0,
                'NE': 45,
                'E': 90,
                'SE': 135,
                'S': 180,
                'SW': 225,
                'W': 270,
                'NW': 315
            };
            return directions[direction] || 0;
        }

        function updateCompass(direction) {
            const degrees = getWindDirectionDegree(direction);
            
            const directionElement = document.getElementById('windDirectionText');
            const degreeElement = document.getElementById('windDirectionDegree');
            
            if (directionElement) {
                directionElement.textContent = direction;
            }
            if (degreeElement) {
                degreeElement.textContent = degrees + '°';
            }
            
            const needle = document.getElementById('compassNeedle');
            if (needle) {
                let rotation = degrees;
                let diff = rotation - currentCompassRotation;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                rotation = currentCompassRotation + diff;
                currentCompassRotation = rotation;
                needle.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
            }
        }

        function createCurrentDataInterface() {
            const content = `
                <div class="dashboard-grid">
                    <div class="readings-card">
                        <h2 class="card-title">
                            <i class="fas fa-chart-line"></i>
                            القراءات الحالية
                        </h2>
                        <div class="readings-grid">
                            <div class="reading-item" id="tempItem">
                                <div class="reading-icon"><i class="fas fa-thermometer-half"></i></div>
                                <div class="reading-info">
                                    <h3>درجة الحرارة</h3>
                                    <div class="reading-value" id="temperatureValue">0.0°C</div>
                                </div>
                            </div>
                            <div class="reading-item" id="humidityItem">
                                <div class="reading-icon"><i class="fas fa-tint"></i></div>
                                <div class="reading-info">
                                    <h3>الرطوبة</h3>
                                    <div class="reading-value" id="humidityValue">0.0%</div>
                                </div>
                            </div>
                            <div class="reading-item" id="pressureItem">
                                <div class="reading-icon"><i class="fas fa-tachometer-alt"></i></div>
                                <div class="reading-info">
                                    <h3>الضغط الجوي</h3>
                                    <div class="reading-value" id="pressureValue">0.0hPa</div>
                                </div>
                            </div>
                            <div class="reading-item" id="windSpeedItem">
                                <div class="reading-icon"><i class="fas fa-wind"></i></div>
                                <div class="reading-info">
                                    <h3>سرعة الرياح</h3>
                                    <div class="reading-value" id="windSpeedValue">0.0m/s</div>
                                </div>
                            </div>
                            <div class="reading-item" id="rainItem">
                                <div class="reading-icon"><i class="fas fa-cloud-rain"></i></div>
                                <div class="reading-info">
                                    <h3>حالة المطر</h3>
                                    <div class="reading-value" id="rainValue">☀️ غير ممطر</div>
                                </div>
                            </div>
                        </div>
                        <div class="system-info">
                            <div class="info-item">
                                <i class="far fa-clock"></i>
                                <span>آخر تحديث: <span id="readingTime">الآن</span></span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-satellite"></i>
                                <span>المحطة: ${currentDevice}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="compass-card">
                        <h2 class="card-title">
                            <i class="fas fa-compass"></i>
                            اتجاه الرياح
                        </h2>
                        <div class="compass-wrapper">
                            <div class="compass-outer">
                                <div class="compass-inner">
                                    <div class="compass-directions">
                                        <div class="compass-direction direction-n">N</div>
                                        <div class="compass-direction direction-e">E</div>
                                        <div class="compass-direction direction-s">S</div>
                                        <div class="compass-direction direction-w">W</div>
                                    </div>
                                    <div class="compass-needle" id="compassNeedle">
                                        <div class="needle"></div>
                                    </div>
                                    <div class="compass-center"></div>
                                </div>
                            </div>
                        </div>
                        <div class="direction-info">
                            <div class="direction-text" id="windDirectionText">غير معروف</div>
                            <div class="direction-degree" id="windDirectionDegree">0°</div>
                        </div>
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = content;
        }

        async function loadArchiveData() {
            const selectedDate = document.getElementById('archiveDate').value;
            if (!selectedDate) {
                alert('الرجاء اختيار تاريخ أولاً');
                return;
            }
            
            try {
                showLoading(true);
                
                const response = await fetch(`/api/sensor?device=${currentDevice}&date=${selectedDate}`);
                
                if (!response.ok) {
                    throw new Error(`خطأ في جلب الأرشيف: ${response.status}`);
                }
                
                const archiveData = await response.json();
                
                if (!archiveData || archiveData.length === 0) {
                    archiveContent.innerHTML = `
                        <div class="no-data">
                            <i class="fas fa-database fa-3x" style="color: #64748b; margin-bottom: 20px;"></i>
                            <h2 style="color: #94a3b8;">لا توجد بيانات في الأرشيف</h2>
                            <p style="color: #64748b; margin-top: 10px;">لم يتم العثور على بيانات للتاريخ المحدد</p>
                        </div>
                    `;
                } else {
                    displayArchiveData(archiveData, selectedDate);
                }
                
                archiveModal.style.display = 'flex';
                
            } catch (error) {
                console.error('خطأ في تحميل الأرشيف:', error);
                archiveContent.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-triangle fa-3x" style="color: #ef4444; margin-bottom: 20px;"></i>
                        <h2 style="color: #ef4444;">خطأ في تحميل الأرشيف</h2>
                        <p style="color: #ef4444; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
                archiveModal.style.display = 'flex';
            } finally {
                showLoading(false);
            }
        }

        function displayArchiveData(data, date) {
            let tableHTML = `
                <h3 style="color: #38bdf8; margin-bottom: 20px;">بيانات الأرشيف لتاريخ: ${date}</h3>
                <div style="overflow-x: auto;">
                    <table class="archive-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الوقت</th>
                                <th>درجة الحرارة</th>
                                <th>الرطوبة</th>
                                <th>الضغط الجوي</th>
                                <th>سرعة الرياح</th>
                                <th>اتجاه الرياح</th>
                                <th>حالة المطر</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            data.forEach((item, index) => {
                const time = item.time ? new Date(item.time).toLocaleTimeString('ar-SA') : '--';
                const temperature = item.temperture || item.temperature || 0;
                const humidity = item.humidity || 0;
                const pressure = item.pressure || 0;
                const windSpeed = item.winds || item.windS || 0;
                const windDirection = item.windd || item.windD || '--';
                const rainy = item.rainy || false;
                const rainStatus = (rainy === true || rainy === 1 || rainy === 'true') ? '🌧️ ممطر' : '☀️ غير ممطر';
                
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${time}</td>
                        <td>${temperature.toFixed(1)}°C</td>
                        <td>${humidity.toFixed(1)}%</td>
                        <td>${pressure.toFixed(1)}hPa</td>
                        <td>${windSpeed.toFixed(1)}m/s</td>
                        <td>${windDirection}</td>
                        <td>${rainStatus}</td>
                    </tr>
                `;
            });
            
            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;
            
            archiveContent.innerHTML = tableHTML;
        }

        function closeArchive() {
            archiveModal.style.display = 'none';
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            if (autoRefreshEnabled) {
                startAutoRefresh();
                autoRefreshText.textContent = 'التحديث التلقائي: مفعل';
            } else {
                stopAutoRefresh();
                autoRefreshText.textContent = 'التحديث التلقائي: معطل';
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            refreshInterval = setInterval(loadCurrentData, 5000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function updateStatus(message, isConnected) {
            statusText.textContent = message;
            const statusDot = document.getElementById('statusDot');
            if (statusDot) {
                statusDot.className = 'status-dot ' + (isConnected ? 'online' : 'offline');
            }
        }

        function showLoadingEffect() {
            const refreshBtn = document.querySelector('.control-btn');
            if (refreshBtn && refreshBtn.textContent.includes('تحديث البيانات')) {
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
                refreshBtn.disabled = true;
            }
        }

        function hideLoadingEffect() {
            const refreshBtn = document.querySelector('.control-btn');
            if (refreshBtn && refreshBtn.textContent.includes('جاري التحديث')) {
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث البيانات';
                refreshBtn.disabled = false;
            }
        }

        function showLoading(show) {
            loadingOverlay.style.display = show ? 'flex' : 'none';
        }

        function showNoData() {
            if (!document.getElementById('temperatureValue')) {
                createCurrentDataInterface();
            }
            updateStatus('لا توجد بيانات', false);
        }

        function showError(message) {
            if (!document.getElementById('temperatureValue')) {
                createCurrentDataInterface();
            }
            updateStatus('خطأ في الاتصال', false);
        }

        window.weatherInitialized = false;

        document.addEventListener('DOMContentLoaded', function() {
            createCurrentDataInterface();
        });

        archiveModal.addEventListener('click', function(e) {
            if (e.target === this) closeArchive();
        });
    </script>
</body>
</html>
